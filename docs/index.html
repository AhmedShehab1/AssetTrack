<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Files Manager API Docs</title>
    <!-- Pin to a specific version (e.g., @5) to prevent unexpected breakages -->
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
    <div id="swagger-ui"></div>
    
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <!-- Optional: Only needed if you want the "Standalone" layout with the top bar -->
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    
    <script>
      window.onload = function() {
        window.ui = SwaggerUIBundle({
          url: './openapi.yaml', 
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset // Reference the preset directly
          ],
          layout: "BaseLayout", // Or "StandaloneLayout" if you use the preset above
        });
      }
    </script>
</body>
</html>
