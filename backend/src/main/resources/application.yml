server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: AssetTrack
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: jdbc:postgresql://localhost:5432/assettrack
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  config:
    import: "optional:file:.env[.properties]"
  mail:
    host: ${MAILTRAP_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAILTRAP_PORT:2525}
    username: ${MAILTRAP_USERNAME:}
    password: ${MAILTRAP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
mail:
  from: ${MAIL_FROM:no-reply@assettrack.local}

jwt:
  issuer: assettrack-api

alerts:
  low-stock-threshold: 5
  recipient-email: admin@assettrack.com

rsa:
  private-key-location: ${RSA_PRIVATE_KEY_LOCATION:classpath:private_pkcs8.pem}
  public-key-location: ${RSA_PUBLIC_KEY_LOCATION:classpath:public.pem}